<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tekuno · Tablero de dirección</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TABLERO DE DIRECCIÓN · TEKUNO
   Mismo modelo de datos que el tablero general (un solo contrato de API).
   Lienzo fijo de 1920x1080 escalado completo: proporciones idénticas
   en monitor, proyector o TV. 1rem = 24px.
   ========================================================================== */

:root{
  --navy:#1A2733;
  --vermilion:#FF4A33;
  --steel:#537892;
  --mauve:#B79A97;

  --bg:#101A23;
  --surface:#18242F;
  --surface-2:#1F2E3B;
  --line:rgba(255,255,255,0.10);
  --line-soft:rgba(255,255,255,0.055);

  --text:#EDF3F8;
  --text-2:#A9BCCB;
  --text-3:#6F8494;

  --ok:#3FBF7F;
  --warn:#F5B544;
  --alert:var(--vermilion);

  --gap:1.15rem;
  --r:0.72rem;
}

*,*::before,*::after{box-sizing:border-box;}
html{font-size:24px;}
body{
  margin:0;width:100vw;height:100vh;overflow:hidden;
  background:#080D12;
  font-family:'Inter',system-ui,sans-serif;color:var(--text);
}
#canvas{
  position:fixed;left:50%;top:50%;
  width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(1);
  transform-origin:center center;
  overflow:hidden;
  background:
    radial-gradient(90% 60% at 84% -12%, rgba(83,120,146,0.22), transparent 62%),
    radial-gradient(70% 55% at -6% 108%, rgba(183,154,151,0.11), transparent 58%),
    var(--bg);
}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;font-weight:600;letter-spacing:-0.02em;}
p{margin:0;}
ul{margin:0;padding:0;list-style:none;}
.num{font-variant-numeric:tabular-nums;font-family:'Space Grotesk',sans-serif;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

/* ---------------- Estructura ---------------- */
.frame{
  height:1080px;display:grid;
  grid-template-columns:13.5rem 1fr;
  grid-template-rows:auto 1fr auto;
  grid-template-areas:"top top" "rail stage" "feed feed";
  column-gap:1.4rem;
  padding:1.3rem 1.6rem 1rem;
}

/* ---------------- Cabecera ---------------- */
.topbar{
  grid-area:top;display:flex;align-items:center;gap:1.4rem;
  padding-bottom:0.85rem;border-bottom:1px solid var(--line);margin-bottom:1.1rem;
}
.brand{display:flex;align-items:center;gap:0.6rem;flex:none;}
.brand .mark{width:2.1rem;height:2.1rem;flex:none;}
.brand .word{font-family:'Space Grotesk',sans-serif;font-size:1.28rem;font-weight:600;letter-spacing:-0.02em;line-height:1;}
.brand .word b{color:var(--vermilion);font-weight:700;}
.brand .sub{font-size:0.62rem;color:var(--text-3);margin-top:0.12rem;}
.topbar .sp{flex:1;}
.clock{display:flex;align-items:baseline;gap:0.7rem;}
.clock .t{font-family:'Space Grotesk',sans-serif;font-size:1.85rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;}
.clock .d{font-size:0.75rem;color:var(--text-2);}
.clock .d::first-letter{text-transform:uppercase;}
.sync{
  display:flex;align-items:center;gap:0.45rem;font-size:0.68rem;color:var(--text-3);
  padding-left:1.2rem;border-left:1px solid var(--line);
}
.sync .led{width:0.42rem;height:0.42rem;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0.26rem rgba(63,191,127,0.14);}
.sync[data-state="stale"] .led{background:var(--warn);box-shadow:0 0 0 0.26rem rgba(245,181,68,0.14);}
.sync[data-state="offline"] .led{background:var(--alert);box-shadow:0 0 0 0.26rem rgba(255,74,51,0.14);}

/* ---------------- Riel ---------------- */
.rail{grid-area:rail;display:flex;flex-direction:column;gap:0.3rem;}
.rail-item{
  display:grid;grid-template-columns:1.5rem 1fr;align-items:center;gap:0.5rem;
  padding:0.55rem 0.6rem;border-radius:0.5rem;color:var(--text-3);position:relative;
  transition:background .35s ease,color .35s ease;
}
.rail-item .ix{font-family:'Space Grotesk',sans-serif;font-size:0.68rem;font-variant-numeric:tabular-nums;opacity:.6;}
.rail-item .nm{font-size:0.74rem;line-height:1.22;}
.rail-item.done{color:var(--text-2);}
.rail-item.on{background:var(--surface);color:var(--text);}
.rail-item.on .ix{color:var(--vermilion);opacity:1;}
.rail-item .bar{position:absolute;left:0;top:0.4rem;bottom:0.4rem;width:2px;border-radius:2px;background:var(--line);overflow:hidden;}
.rail-item.on .bar{background:rgba(255,74,51,0.24);}
.rail-item .bar i{display:block;width:100%;height:0;background:var(--vermilion);}
.rail-foot{margin-top:auto;padding-top:0.75rem;border-top:1px solid var(--line-soft);}
.rail-foot .badge{
  display:inline-block;padding:0.18rem 0.45rem;border-radius:0.3rem;
  background:rgba(183,154,151,0.16);color:var(--mauve);font-size:0.6rem;margin-bottom:0.35rem;
}
.rail-foot p{font-size:0.6rem;color:var(--text-3);line-height:1.45;}

/* ---------------- Escenario ---------------- */
.stage{grid-area:stage;position:relative;min-height:0;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;gap:var(--gap);}
.slide.on{display:flex;}
.slide.on > *{animation:en .5s cubic-bezier(.2,.8,.2,1) both;}
.slide.on > *:nth-child(1){animation-delay:.02s}
.slide.on > *:nth-child(2){animation-delay:.09s}
.slide.on > *:nth-child(3){animation-delay:.16s}
@keyframes en{from{opacity:0;transform:translateY(0.55rem);}to{opacity:1;transform:none;}}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:2rem;flex:none;}
.head h2{font-size:1.42rem;line-height:1.1;}
.head .note{font-size:0.72rem;color:var(--text-2);max-width:52ch;text-align:right;line-height:1.45;}

/* ---------------- Piezas ---------------- */
.panel{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:0.9rem 1.05rem;display:flex;flex-direction:column;min-height:0;
}
.p-title{
  display:flex;align-items:baseline;justify-content:space-between;gap:0.8rem;
  font-family:'Space Grotesk',sans-serif;font-size:0.85rem;font-weight:500;margin-bottom:0.7rem;flex:none;
}
.p-title span{font-family:'Inter',sans-serif;font-size:0.64rem;color:var(--text-3);}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);flex:none;}
.kpi{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:0.85rem 1rem;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--steel);}
.kpi.a::after{background:var(--vermilion);}
.kpi.g::after{background:var(--ok);}
.kpi .l{font-size:0.66rem;color:var(--text-2);margin-bottom:0.3rem;}
.kpi .v{font-family:'Space Grotesk',sans-serif;font-size:2.5rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;}
.kpi .v small{font-size:0.72rem;color:var(--text-3);font-weight:500;margin-left:0.3rem;}
.kpi .f{margin-top:0.4rem;font-size:0.65rem;color:var(--text-3);}
.up{color:var(--ok);} .dn{color:var(--alert);}

/* Barras horizontales */
.hb-wrap{display:flex;flex-direction:column;gap:0.5rem;flex:1;justify-content:center;min-height:0;}
.hb{display:grid;grid-template-columns:7.5rem 1fr 2.4rem 2.4rem;align-items:center;gap:0.6rem;}
.hb .n{font-size:0.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hb .tr{height:0.62rem;border-radius:0.4rem;background:rgba(255,255,255,0.07);overflow:hidden;}
.hb .tr i{display:block;height:100%;border-radius:0.4rem;background:var(--steel);transition:width .8s ease;}
.hb .tr i.hot{background:var(--vermilion);}
.hb .tr i.good{background:var(--ok);}
.hb .v{font-family:'Space Grotesk',sans-serif;font-size:0.88rem;text-align:right;font-variant-numeric:tabular-nums;}
.hb .pc{font-size:0.65rem;color:var(--text-3);text-align:right;font-variant-numeric:tabular-nums;}

/* Barras verticales agrupadas */
.spark{flex:1;display:flex;align-items:flex-end;gap:0.55rem;min-height:0;}
.spark .g{flex:1;display:flex;flex-direction:column;align-items:center;gap:0.28rem;height:100%;justify-content:flex-end;}
.spark .pair{display:flex;align-items:flex-end;gap:0.16rem;width:100%;height:100%;justify-content:center;}
.spark .b{width:38%;border-radius:0.14rem 0.14rem 0 0;transition:height .8s ease;}
.spark .b.nue{background:var(--vermilion);} .spark .b.cer{background:var(--steel);}
.spark .c{font-size:0.62rem;color:var(--text-3);}
.lg{display:flex;gap:0.9rem;margin-top:0.4rem;flex:none;}
.lg span{display:flex;align-items:center;gap:0.3rem;font-size:0.62rem;color:var(--text-2);}
.lg i{width:0.42rem;height:0.42rem;border-radius:0.1rem;}

/* Anillo */
.ring-row{display:flex;align-items:center;gap:1rem;flex:1;}
.ring{position:relative;width:5.6rem;height:5.6rem;flex:none;display:grid;place-items:center;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring .bgc{stroke:rgba(255,255,255,0.08);}
.ring .fgc{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset 1s ease;}
.ring .mid{position:absolute;text-align:center;}
.ring .mid b{display:block;font-family:'Space Grotesk',sans-serif;font-size:1.45rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
.ring .mid span{font-size:0.58rem;color:var(--text-3);}
.facts{display:flex;flex-direction:column;gap:0.55rem;}
.facts .f{display:flex;align-items:baseline;gap:0.45rem;}
.facts .f b{font-family:'Space Grotesk',sans-serif;font-size:1.28rem;line-height:1;font-variant-numeric:tabular-nums;}
.facts .f span{font-size:0.65rem;color:var(--text-2);line-height:1.25;}

/* Tabla */
table{width:100%;border-collapse:collapse;}
th{
  text-align:right;font-size:0.62rem;font-weight:500;color:var(--text-3);
  padding:0 0 0.5rem;border-bottom:1px solid var(--line);white-space:nowrap;
}
th:first-child{text-align:left;}
td{padding:0.52rem 0;border-bottom:1px solid var(--line-soft);font-size:0.78rem;text-align:right;}
td:first-child{text-align:left;}
tr:last-child td{border-bottom:none;}
td .sysn{font-size:0.82rem;font-weight:600;}
td .syst{font-size:0.62rem;color:var(--text-3);}
td.n{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;}

.chip{
  display:inline-flex;align-items:center;gap:0.3rem;padding:0.2rem 0.5rem;border-radius:0.32rem;
  font-size:0.65rem;background:rgba(255,255,255,0.07);color:var(--text-2);white-space:nowrap;
}
.chip.al{background:rgba(255,74,51,0.16);color:#FF8B7A;}
.chip.wa{background:rgba(245,181,68,0.15);color:#F7CB7C;}
.chip.ok{background:rgba(63,191,127,0.14);color:#7BD9A9;}
.chip.in{background:rgba(83,120,146,0.24);color:#A8C6DA;}

/* Personas */
.people{display:flex;flex-direction:column;gap:0.5rem;overflow:hidden;min-height:0;}
.person{display:flex;align-items:center;gap:0.6rem;padding-bottom:0.5rem;border-bottom:1px solid var(--line-soft);}
.person:last-child{border-bottom:none;padding-bottom:0;}
.person .i{flex:1;min-width:0;}
.person .nm{font-size:0.8rem;line-height:1.25;}
.person .rl{font-size:0.64rem;color:var(--text-3);}
.person .w{font-family:'Space Grotesk',sans-serif;font-size:0.75rem;color:var(--text-2);text-align:right;white-space:nowrap;}
.person .w small{display:block;font-family:'Inter',sans-serif;font-size:0.6rem;color:var(--text-3);}
.av{
  width:1.7rem;height:1.7rem;border-radius:50%;flex:none;display:grid;place-items:center;
  font-family:'Space Grotesk',sans-serif;font-size:0.66rem;font-weight:600;color:#0F1720;
}

/* Línea de tiempo de ausencias */
.tl{display:flex;flex-direction:column;gap:0.5rem;flex:1;min-height:0;justify-content:center;}
.tl-h{display:grid;grid-template-columns:9.5rem 1fr;gap:0.8rem;font-size:0.58rem;color:var(--text-3);}
.tl-h .sc{display:grid;grid-template-columns:repeat(21,1fr);}
.tl-h .sc span{text-align:center;font-variant-numeric:tabular-nums;}
.tl-h .sc span.wk{color:rgba(255,255,255,0.2);}
.tl-r{display:grid;grid-template-columns:9.5rem 1fr;gap:0.8rem;align-items:center;}
.lane{position:relative;height:1.5rem;border-radius:0.35rem;background:rgba(255,255,255,0.04);overflow:hidden;}
.lane .gr{position:absolute;inset:0;display:grid;grid-template-columns:repeat(21,1fr);}
.lane .gr i{border-right:1px solid rgba(255,255,255,0.045);}
.lane .gr i.wk{background:rgba(255,255,255,0.035);}
.lane .sp{
  position:absolute;top:0.22rem;bottom:0.22rem;border-radius:0.28rem;
  display:flex;align-items:center;padding:0 0.5rem;
  font-size:0.62rem;color:#0F1720;font-weight:600;white-space:nowrap;overflow:hidden;
}
.lane .now{position:absolute;top:0;bottom:0;width:2px;background:var(--vermilion);opacity:.9;}

/* Calendario */
.cal{display:flex;flex-direction:column;flex:1;min-height:0;}
.cal .dows{display:grid;grid-template-columns:repeat(7,1fr);gap:0.28rem;margin-bottom:0.28rem;flex:none;}
.cal .dows span{text-align:center;font-size:0.58rem;color:var(--text-3);letter-spacing:0.08em;}
.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:0.28rem;flex:1;min-height:0;}
.cell{
  border:1px solid var(--line-soft);border-radius:0.32rem;background:var(--surface-2);
  padding:0.2rem;display:flex;flex-direction:column;align-items:center;gap:0.14rem;
  min-height:0;overflow:hidden;
}
.cell.void{border-color:transparent;background:transparent;}
.cell .d{font-family:'Space Grotesk',sans-serif;font-size:0.68rem;color:var(--text-2);font-variant-numeric:tabular-nums;}
.cell.today{border-color:rgba(255,74,51,0.6);background:linear-gradient(180deg,rgba(255,74,51,0.12),var(--surface-2));}
.cell.today .d{color:var(--vermilion);font-weight:700;}
.pill{
  width:100%;border-radius:0.22rem;padding:0.06rem 0.16rem;font-size:0.5rem;font-weight:600;
  color:#0F1720;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
}
.pill.cum{background:#8FB8F0;} .pill.vac{background:#7BD9A9;}
.pill.jun{background:#C3A9E8;} .pill.cap{background:#F0C878;}

/* Reconocimiento */
.reco{display:grid;grid-template-columns:1.15fr 1fr;gap:var(--gap);flex:1;min-height:0;}
.reco-main{
  background:linear-gradient(140deg,rgba(255,74,51,0.14),rgba(183,154,151,0.08) 55%,var(--surface));
  border:1px solid rgba(255,74,51,0.28);border-radius:var(--r);
  padding:1.2rem 1.35rem;display:flex;flex-direction:column;justify-content:center;gap:0.8rem;
}
.reco-main .kick{font-size:0.68rem;color:var(--mauve);}
.reco-main h3{font-size:1.85rem;line-height:1.08;}
.reco-main .lead{font-size:0.78rem;color:var(--text-2);line-height:1.5;max-width:44ch;}
.ba{display:flex;align-items:center;gap:1.1rem;margin-top:0.3rem;}
.ba .box{background:rgba(255,255,255,0.05);border-radius:0.5rem;padding:0.6rem 0.9rem;text-align:center;}
.ba .box .l{font-size:0.58rem;color:var(--text-3);letter-spacing:0.06em;}
.ba .box .v{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;line-height:1.1;}
.ba .box .u{font-size:0.55rem;color:var(--text-3);}
.ba .box.now{background:rgba(63,191,127,0.12);}
.ba .box.now .v{color:var(--ok);}
.ba .arw{font-size:1.1rem;color:var(--text-3);}
.ba .delta{
  font-family:'Space Grotesk',sans-serif;font-size:1.15rem;font-weight:700;color:var(--ok);
  display:flex;flex-direction:column;line-height:1.1;
}
.ba .delta small{font-family:'Inter',sans-serif;font-size:0.58rem;color:var(--text-3);font-weight:400;}
.reco-side{display:flex;flex-direction:column;gap:var(--gap);min-height:0;}
.vals{display:flex;flex-wrap:wrap;gap:0.4rem;}
.vals span{
  padding:0.28rem 0.6rem;border-radius:0.32rem;background:rgba(83,120,146,0.18);
  color:#A8C6DA;font-size:0.65rem;
}

/* Filosofía */
.phil-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);flex:1;min-height:0;}
.phil{
  border:1px solid;border-radius:var(--r);background:var(--surface);
  padding:1.15rem 1.25rem;display:flex;flex-direction:column;gap:0.5rem;
  position:relative;overflow:hidden;transition:transform .5s ease, box-shadow .5s ease;
}
.phil::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .5s ease;
  background:linear-gradient(160deg,var(--tone-soft),transparent 60%);}
.phil.hot{transform:translateY(-0.35rem);box-shadow:0 0.7rem 1.8rem rgba(0,0,0,0.35);}
.phil.hot::before{opacity:1;}
.phil > *{position:relative;z-index:1;}
.phil .ico{width:1.7rem;height:1.7rem;border-radius:0.42rem;display:grid;place-items:center;
  background:var(--tone-soft);color:var(--tone);}
.phil .ico svg{width:0.9rem;height:0.9rem;}
.phil .eb{font-size:0.6rem;color:var(--tone);letter-spacing:0.1em;}
.phil h3{font-size:1.15rem;}
.phil p{font-size:0.76rem;color:var(--text-2);line-height:1.55;}
.phil ul{display:flex;flex-direction:column;gap:0.32rem;}
.phil li{font-size:0.76rem;color:var(--text-2);display:flex;gap:0.45rem;align-items:baseline;}
.phil li::before{content:"";width:0.24rem;height:0.24rem;border-radius:50%;background:var(--tone);flex:none;}
.phil .pb{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--tone);transition:width 4s linear;}
.phil.hot .pb{width:100%;}

/* Pie */
.feed{
  grid-area:feed;margin-top:0.9rem;padding-top:0.7rem;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:1rem;
}
.feed .tag{
  flex:none;padding:0.22rem 0.55rem;border-radius:0.3rem;
  background:rgba(255,74,51,0.16);color:#FF8B7A;font-size:0.62rem;font-weight:600;
}
.feed .msg{flex:1;font-size:0.72rem;color:var(--text-2);}
.feed .keys{flex:none;font-size:0.6rem;color:var(--text-3);}
.feed kbd{font-family:'Space Grotesk',sans-serif;background:rgba(255,255,255,0.07);border-radius:0.2rem;padding:0.04rem 0.28rem;margin:0 0.1rem;}
.pausedf{display:none;color:var(--warn);}
body.paused .pausedf{display:inline;}

/* Rejillas por slide */
.two{display:grid;grid-template-columns:1.32fr 1fr;gap:var(--gap);flex:1;min-height:0;}
.two-b{display:grid;grid-template-columns:1fr 1.05fr;gap:var(--gap);flex:1;min-height:0;}
.stack{display:flex;flex-direction:column;gap:var(--gap);min-height:0;}
</style>
</head>
<body>

<div id="canvas">
<div class="frame">

  <div class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="1" y="1" width="28" height="28" rx="7" fill="#FF4A33"/>
        <path d="M8 10.5H22" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <path d="M8 15H17" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <circle cx="21.5" cy="15" r="2.2" fill="white"/>
        <path d="M8 19.5H14" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="word">TEK<b>UNO</b></div>
        <div class="sub">Tablero de dirección · operación semanal</div>
      </div>
    </div>
    <div class="sp"></div>
    <div class="clock">
      <span class="t num" id="clock">--:--</span>
      <span class="d" id="fecha">—</span>
    </div>
    <div class="sync" id="sync" data-state="ok"><span class="led"></span><span id="syncTxt">Sincronizando…</span></div>
  </div>

  <nav class="rail" id="rail"></nav>

  <main class="stage">
    <section class="slide" id="s1"></section>
    <section class="slide" id="s2"></section>
    <section class="slide" id="s3"></section>

<script>
/* ==========================================================================
   1. CONFIGURACIÓN
   ========================================================================== */
const CONFIG = {
  duraciones: { s1:22, s2:22, s3:20, s4:20, s5:18, s6:16 },  // segundos por slide
  refrescoDatos: 60,        // segundos entre consultas a la API
  recargaTotal: 6 * 3600    // recarga completa del navegador
};

/* ==========================================================================
   2. ORIGEN DE DATOS
   Contrato idéntico al del tablero general: los dos consumen los mismos
   endpoints. Pon USAR_DATOS_FICTICIOS en false y llena ENDPOINTS.
   ========================================================================== */
const USAR_DATOS_FICTICIOS = true;

const ENDPOINTS = {
  metricas:      '/api/tablero/metricas',
  tickets:       '/api/tablero/tickets',
  anuncios:      '/api/tablero/anuncios',
  cumpleanos:    '/api/tablero/cumpleanos',
  vacaciones:    '/api/tablero/vacaciones',
  capacitaciones:'/api/tablero/capacitaciones',
  juntas:        '/api/tablero/juntas',
  recordatorio:  '/api/tablero/recordatorio'
};

const TOKEN = '';

const MAPEO = {
  cumpleanos: r => (r.items || r).map(x => ({
    nombre: x.nombre ?? x.fullName, area: x.area ?? x.department,
    fecha: new Date(x.fecha ?? x.birthDate)
  })),
  vacaciones: r => (r.items || r).map(x => ({
    nombre: x.nombre ?? x.fullName, area: x.area ?? x.department,
    tipo: x.tipo ?? 'Vacaciones',
    ini: new Date(x.inicio ?? x.startDate), fin: new Date(x.fin ?? x.endDate)
  })),
  capacitaciones: r => (r.items || r).map(x => ({
    nombre: x.nombre ?? x.fullName, area: x.area ?? x.department, tema: x.tema ?? x.topic,
    ini: new Date(x.inicio ?? x.startDate), fin: new Date(x.fin ?? x.endDate)
  }))
};

/* ==========================================================================
   3. UTILIDADES
   ========================================================================== */
const $ = s => document.querySelector(s);
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DOW = ['LU','MA','MI','JU','VI','SÁ','DO'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

const hoy = () => new Date();
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const entre = (d,a,b) => d >= new Date(a.getFullYear(),a.getMonth(),a.getDate()) && d <= new Date(b.getFullYear(),b.getMonth(),b.getDate());
const fechaCorta = d => d.getDate() + ' ' + MESES_C[d.getMonth()].slice(0,3).toLowerCase();
const fechaLarga = d => d.getDate() + ' ' + MESES_C[d.getMonth()];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = new Intl.NumberFormat('es-MX');
const nombre2 = n => n.split(' ').slice(0,2).join(' ');

const PAL = ['#B79A97','#537892','#FF4A33','#7BD9A9','#F5B544','#A8C6DA'];
function colorAv(n){ let h=0; for(let i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))%997; return PAL[h%PAL.length]; }
function avatar(n){
  const ini = n.split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase();
  return `<span class="av" style="background:${colorAv(n)}">${ini}</span>`;
}

let sd = 11;
const jitter = (b,p) => { sd=(sd*9301+49297)%233280; return Math.round(b*(1+(sd/233280-0.5)*2*p)); };

/* ==========================================================================
   4. DATOS DE EJEMPLO (mismo contenido que el tablero general)
   ========================================================================== */
function datosFicticios(){
  const n = hoy(), Y = n.getFullYear(), M = n.getMonth();

    },

    anuncios: [{

      lead: 'Su esfuerzo, talento y compromiso generan grandes resultados. Este éxito es prueba de que cuando trabajamos con enfoque, colaboración y pasión, transformamos procesos y mejoramos vidas.',

      cierre: '¡Sigamos innovando!',

    }],

    cumpleanos: [
      { nombre:'Edgar Carcaño',      area:'Dirección de Negocios', fecha: dia(2)  },
      { nombre:'Sthepanie Teyssier', area:'Automatización',        fecha: dia(9)  },
      { nombre:'Astrid Viridiana',   area:'Desarrollo',            fecha: dia(22) }
    ],

    vacaciones: [
      { nombre:'Lina Gómez', area:'Diseño UX/UI', tipo:'Vacaciones', ini: dia(10), fin: dia(14) }
    ],

    ],

    juntas: [
      { titulo:'Arranque de semana',     area:'Todo el equipo · Sala Cholula', fecha: dia(7),  hora:'09:00' },
      { titulo:'Comité de calidad',      area:'Implementación · Sala 2',       fecha: dia(16), hora:'13:00' },
      { titulo:'Revisión con Dirección', area:'Jefaturas · Sala principal',    fecha: dia(24), hora:'17:00' }
    ],

    tickets: {
      nuevos:   jitter(2,.4),

      urgentes: jitter(3,.4),

      primeraRespuesta: (jitter(38,.15)/10).toFixed(1),
      sistemas: [
        { n:'Odoo',               total: jitter(46,.02),    nuevo:1, activo:1, cerrados: jitter(44,.02),    sinInc:0 },
        { n:'Laserfiche',         total: jitter(215,.01),   nuevo:0, activo:3, cerrados: jitter(212,.01),   sinInc:0 },
        { n:'Microsoft',          total: jitter(23,.03),    nuevo:0, activo:0, cerrados: jitter(23,.03),    sinInc:0 },
        { n:'Plataforma digital', total: jitter(9,.1),      nuevo:1, activo:0, cerrados: jitter(8,.1),      sinInc:0 },
        { n:'Mantenimiento',      total: jitter(408,.01),   nuevo:0, activo:9, cerrados: jitter(399,.01),   sinInc:0 },
        { n:'Soporte Mizza',      total: jitter(1250,.005), nuevo:0, activo:6, cerrados: jitter(1244,.005), sinInc:0 }
      ],
      serie: ['L','M','M','J','V','S','D'].map((d,i) => ({
        d, nuevos: jitter([6,9,7,11,8,3,2][i], .25), cerrados: jitter([5,8,9,10,9,4,1][i], .25)
      }))
    },

    filosofia: {
      mision:'Trabajar en conjunto con nuestros clientes para poder entender sus necesidades y ofrecer los servicios que apoyen en su desarrollo y crecimiento, integrando los factores tecnológicos y el factor humano',
      vision:'Agregar valor a las organizaciones a través de soluciones tecnológicas integrales, eficientes y óptimas para cada proceso',
      valores:['Honestidad','Calidad','Trabajo en equipo','Compromiso','Transparencia']
    },

    ts: Date.now()
  };
}

/* ==========================================================================
   5. CAPA DE OBTENCIÓN
   ========================================================================== */
let DATOS = null, ultimaCarga = 0, estado = 'ok';

async function obtenerDatos(){
  if (USAR_DATOS_FICTICIOS){
    DATOS = datosFicticios(); ultimaCarga = Date.now(); estado = 'ok'; return DATOS;
  }
  try{
    const claves = Object.keys(ENDPOINTS);
    const headers = TOKEN ? { Authorization:'Bearer ' + TOKEN } : {};
    const res = await Promise.all(claves.map(k =>
      fetch(ENDPOINTS[k], { headers, cache:'no-store' })
        .then(r => { if(!r.ok) throw new Error(k + ' → ' + r.status); return r.json(); })
    ));
    const nuevo = {};
    claves.forEach((k,i) => nuevo[k] = MAPEO[k] ? MAPEO[k](res[i]) : res[i]);
    DATOS = Object.assign({}, DATOS || datosFicticios(), nuevo, { ts: Date.now() });
    ultimaCarga = Date.now(); estado = 'ok';
  }catch(e){
    console.error('[tablero dirección]', e);
    estado = DATOS ? 'stale' : 'offline';
    if (!DATOS) DATOS = datosFicticios();
  }
  return DATOS;
}

function pintarEstado(){
  const s = $('#sync'); s.dataset.state = estado;
  if (estado === 'offline'){ $('#syncTxt').textContent = 'sin conexión con el origen'; return; }
  const seg = Math.round((Date.now()-ultimaCarga)/1000);
  const rel = seg < 60 ? 'hace ' + seg + ' s' : 'hace ' + Math.round(seg/60) + ' min';
  $('#syncTxt').textContent = (estado==='stale' ? 'último dato ' : 'actualizado ') + rel;
}

/* ==========================================================================
   6. ANÁLISIS DERIVADO
   Lo que la dirección necesita leer y que no viene explícito en los datos.
   ========================================================================== */
function analizar(d){
  const t = d.tickets;
  const nuevos7   = t.serie.reduce((a,x)=>a+x.nuevos,0);
  const cerrados7 = t.serie.reduce((a,x)=>a+x.cerrados,0);
  const carga = t.sistemas.map(s => ({ n:s.n, v:s.activo + s.nuevo })).sort((a,b)=>b.v-a.v);
  const totalCarga = carga.reduce((a,x)=>a+x.v,0) || 1;
  const historico = t.sistemas.reduce((a,s)=>a+s.cerrados,0);
  const fueraHoy = d.vacaciones.filter(v => entre(hoy(), v.ini, v.fin));
  const capsHoy  = d.capacitaciones.filter(c => entre(hoy(), c.ini, c.fin));
  const plantilla = d.metricas.plantilla || 34;
  return {
    nuevos7, cerrados7,
    backlog: nuevos7 - cerrados7,
    tasaCierre: Math.round(cerrados7 / (nuevos7 || 1) * 100),
    carga, totalCarga, historico,
    concentracion: Math.round(carga[0].v / totalCarga * 100),
    fueraHoy, capsHoy,
    plantilla,
    cobertura: Math.round((1 - fueraHoy.length/plantilla) * 100),
    juntasHoy: d.juntas.filter(j => sameDay(j.fecha, hoy())),
    cumpleHoy: d.cumpleanos.filter(c => sameDay(c.fecha, hoy()))
  };
}

/* ==========================================================================
   7. VISTAS
   ========================================================================== */
function cab(t, nota){ return `<div class="head"><h2>${t}</h2><p class="note">${nota}</p></div>`; }

function kpi(l, v, u, foot, cls=''){
  return `<div class="kpi ${cls}">
    <div class="l">${l}</div>
    <div class="v">${v}${u?`<small>${u}</small>`:''}</div>
    <div class="f">${foot||''}</div>
  </div>`;
}

function barras7(t){
  const max = Math.max(...t.serie.flatMap(x=>[x.nuevos,x.cerrados])) || 1;
  return t.serie.map(x => `
    <div class="g"><div class="pair">
      <div class="b nue" style="height:${(x.nuevos/max*100).toFixed(0)}%"></div>
      <div class="b cer" style="height:${(x.cerrados/max*100).toFixed(0)}%"></div>
    </div><span class="c">${x.d}</span></div>`).join('');
}

function anillo(pct, etiqueta){
  const r = 42, c = 2*Math.PI*r;
  return `<div class="ring">
    <svg viewBox="0 0 100 100">
      <circle class="bgc" cx="50" cy="50" r="${r}" fill="none" stroke-width="9"/>
      <circle class="fgc" cx="50" cy="50" r="${r}" fill="none" stroke-width="9"
              stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-pct/100)).toFixed(1)}"/>
    </svg>
    <div class="mid"><b>${pct}%</b><span>${etiqueta}</span></div>
  </div>`;
}

/* ---- 1. Panorama ejecutivo ---- */
function vista1(d){
  const m = d.metricas, t = d.tickets, a = analizar(d);
  const cargaBars = a.carga.map(x => `
    <div class="hb">
      <span class="n">${esc(x.n)}</span>
      <span class="tr"><i class="${x.v>=5?'hot':''}" style="width:${(x.v/a.carga[0].v*100).toFixed(0)}%"></i></span>
      <span class="v">${x.v}</span>
      <span class="pc">${Math.round(x.v/a.totalCarga*100)}%</span>
    </div>`).join('');

  return cab('Panorama de la operación',
    'Cartera, portafolio y carga de soporte del mes en curso. Los datos se refrescan cada minuto sin intervención.')
  + `<div class="kpis">
      ${kpi('Clientes activos', nf.format(m.clientes.total), '', `<b class="up">↑ ${m.clientes.delta}</b> contra el mes anterior`, 'g')}
      ${kpi('Proyectos en curso', nf.format(m.proyectos.total), '', `<b class="up">↑ ${m.proyectos.delta}</b> nuevos este mes`)}
      ${kpi('Oportunidades', nf.format(m.oportunidades.total), '', 'en seguimiento comercial')}
      ${kpi('Tickets abiertos', nf.format(t.abiertos), '', `${t.nuevos} nuevos hoy · <b class="${t.urgentes>2?'dn':''}">${t.urgentes} urgentes</b>`, 'a')}
    </div>`
  + `<div class="two">
      <div class="panel">
        <div class="p-title">Entradas contra cierres <span>últimos 7 días</span></div>
        <div class="spark">${barras7(t)}</div>
        <div class="lg">
          <span><i style="background:var(--vermilion)"></i>Nuevos · ${a.nuevos7}</span>
          <span><i style="background:var(--steel)"></i>Cerrados · ${a.cerrados7}</span>
          <span style="margin-left:auto">Tasa de cierre <b class="${a.tasaCierre>=100?'up':'dn'}">${a.tasaCierre}%</b></span>
        </div>
      </div>
      <div class="panel">
        <div class="p-title">Carga abierta por sistema <span>${a.totalCarga} tickets activos</span></div>
        <div class="hb-wrap">${cargaBars}</div>
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.5rem">
          <span class="chip ${a.backlog>0?'wa':'ok'}">Balance semanal ${a.backlog>0?'+':''}${a.backlog}</span>
          <span class="chip in">${a.concentracion}% en ${esc(a.carga[0].n)}</span>
          <span class="chip ok">${a.cobertura}% de cobertura del equipo</span>
        </div>
      </div>
    </div>`;
}

/* ---- 2. Mesa de servicio a detalle ---- */
function vista2(d){
  const t = d.tickets, a = analizar(d);
  const filas = t.sistemas.slice().sort((x,y)=>(y.activo+y.nuevo)-(x.activo+x.nuevo)).map(s => {
    const ab = s.activo + s.nuevo;
    return `<tr>
      <td><div class="sysn">${esc(s.n)}</div><div class="syst">${nf.format(s.total)} tickets en total</div></td>
      <td class="n">${s.nuevo}</td>
      <td class="n">${s.activo}</td>
      <td class="n">${nf.format(s.cerrados)}</td>
      <td class="n">${s.sinInc}</td>
      <td>${ab === 0 ? '<span class="chip ok">Sin pendientes</span>' : ab >= 5 ? '<span class="chip al">Carga alta</span>' : '<span class="chip in">'+ab+' abiertos</span>'}</td>
    </tr>`;
  }).join('');

  const volBars = t.sistemas.map(s=>({n:s.n,v:s.cerrados})).sort((x,y)=>y.v-x.v);
  const maxVol = volBars[0].v || 1;

  return cab('Mesa de servicio a detalle',
    'Distribución de la carga por sistema y desempeño frente a los tiempos comprometidos.')
  + `<div class="two-b">
      <div class="panel">
        <div class="p-title">Estado por sistema <span>${a.totalCarga} abiertos de ${nf.format(a.historico)} atendidos</span></div>
        <table>
          <thead><tr><th>Sistema</th><th>Nuevos</th><th>Activos</th><th>Cerrados</th><th>Días s/inc.</th><th></th></tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
      <div class="stack">
        <div class="panel">
          <div class="p-title">Cumplimiento de tiempos <span>últimos 30 días</span></div>
          <div class="ring-row">
            ${anillo(t.desempeno,'en tiempo')}

              <div class="f"><b style="color:var(--steel)">${t.primeraRespuesta} h</b><span>primera<br>respuesta</span></div>
              <div class="f"><b style="color:var(--vermilion)">${t.nuevos}</b><span>nuevos<br>hoy</span></div>
              <div class="f"><b style="color:var(--warn)">${t.urgentes}</b><span>urgentes<br>activos</span></div>
            </div>
          </div>
        </div>
        <div class="panel" style="flex:1">
          <div class="p-title">Volumen histórico atendido <span>tickets cerrados</span></div>
          <div class="hb-wrap">
            ${volBars.map(x=>`
              <div class="hb">
                <span class="n">${esc(x.n)}</span>
                <span class="tr"><i class="good" style="width:${(x.v/maxVol*100).toFixed(0)}%"></i></span>

                <span class="pc">${Math.round(x.v/a.historico*100)}%</span>
              </div>`).join('')}
          </div>
        </div>
      </div>
    </div>`;
}

/* ---- 3. Capacidad del equipo ---- */
function vista3(d){
  const a = analizar(d);
  const inicio = addDays(hoy(), -3), N = 21, w = 100/N;

  const escala = Array.from({length:N},(_,i)=>{
    const f = addDays(inicio,i), fin = f.getDay()===0||f.getDay()===6;
    return `<span class="${fin?'wk':''}">${f.getDate()}</span>`;
  }).join('');
  const rejilla = Array.from({length:N},(_,i)=>{
    const f = addDays(inicio,i), fin = f.getDay()===0||f.getDay()===6;
    return `<i class="${fin?'wk':''}"></i>`;
  }).join('');
  const posNow = ((hoy()-inicio)/86400000)*w;

  const ausencias = [
    ...d.vacaciones.map(v=>({...v, tipo:v.tipo||'Vacaciones'})),
    ...d.capacitaciones.map(c=>({...c, tipo:'Capacitación'}))
  ];
  const lanes = ausencias.map(v => {
    const ini = Math.max(0,(v.ini-inicio)/86400000);
    const largo = Math.min(N-ini, ((v.fin-v.ini)/86400000)+1);
    const color = v.tipo==='Capacitación' ? '#A8C6DA' : '#B79A97';
    return `<div class="tl-r">
      <div style="display:flex;align-items:center;gap:0.5rem">${avatar(v.nombre)}
        <div><div style="font-size:0.76rem">${esc(nombre2(v.nombre))}</div>
        <div style="font-size:0.6rem;color:var(--text-3)">${esc(v.area)}</div></div></div>
      <div class="lane">
        <div class="gr">${rejilla}</div>
        <div class="sp" style="left:${(ini*w).toFixed(2)}%;width:${(largo*w).toFixed(2)}%;background:${color}">${esc(v.tipo)}</div>
        <div class="now" style="left:${posNow.toFixed(2)}%"></div>
      </div>
    </div>`;
  }).join('') || `<p style="font-size:0.72rem;color:var(--text-3)">Sin ausencias registradas en el periodo.</p>`;

  const caps = d.capacitaciones.map(c => `
    <div class="person">${avatar(c.nombre)}
      <div class="i"><div class="nm">${esc(nombre2(c.nombre))}</div><div class="rl">${esc(c.tema||c.area)}</div></div>
      <div class="w">${fechaCorta(c.ini)}<small>al ${fechaCorta(c.fin)}</small></div>
    </div>`).join('') || `<p style="font-size:0.72rem;color:var(--text-3)">Sin capacitaciones programadas.</p>`;

  const cumples = d.cumpleanos.slice().sort((x,y)=>x.fecha-y.fecha).map(c => `
    <div class="person">${avatar(c.nombre)}
      <div class="i"><div class="nm">${esc(c.nombre)}</div><div class="rl">${esc(c.area)}</div></div>
      <div class="w">${fechaCorta(c.fecha)}<small>${DIAS[c.fecha.getDay()]}</small></div>
    </div>`).join('');

  return cab('Capacidad del equipo',
    'Quién está disponible, quién no y hasta cuándo. La línea roja marca el día de hoy.')
  + `<div class="kpis">
      ${kpi('Fuera hoy', a.fueraHoy.length, 'de ' + a.plantilla, 'vacaciones, capacitación o día personal', a.fueraHoy.length>3?'a':'')}
      ${kpi('Cobertura', a.cobertura, '%', 'del equipo disponible', 'g')}
      ${kpi('En capacitación', a.capsHoy.length, '', 'formación en curso esta semana')}
      ${kpi('Juntas del mes', d.juntas.length, '', a.juntasHoy.length ? a.juntasHoy.length + ' programadas para hoy' : 'ninguna programada para hoy')}
    </div>`
  + `<div class="two">
      <div class="panel">
        <div class="p-title">Ausencias y formación <span>próximas tres semanas</span></div>
        <div class="tl">
          <div class="tl-h"><span></span><div class="sc">${escala}</div></div>
          ${lanes}
        </div>
      </div>
      <div class="stack">
        <div class="panel" style="flex:1">
          <div class="p-title">Capacitación</div>
          <div class="people">${caps}</div>
        </div>
        <div class="panel" style="flex:1">
          <div class="p-title">Cumpleaños del mes</div>
          <div class="people">${cumples}</div>
        </div>
      </div>
    </div>`;
}

/* ---- 4. Calendario del mes ---- */
function vista4(d){
  const n = hoy(), Y = n.getFullYear(), M = n.getMonth();
  const offset = (new Date(Y,M,1).getDay()+6)%7;
  const total = new Date(Y,M+1,0).getDate();

  const eventos = f => {
    const out = [];
    d.cumpleanos.forEach(c=>{ if(sameDay(c.fecha,f)) out.push({c:'cum',t:c.nombre.split(' ')[0]}); });
    d.vacaciones.forEach(v=>{ if(entre(f,v.ini,v.fin)) out.push({c:'vac',t:v.nombre.split(' ')[0]}); });
    d.capacitaciones.forEach(c=>{ if(entre(f,c.ini,c.fin)) out.push({c:'cap',t:'Capacit.'}); });
    d.juntas.forEach(j=>{ if(sameDay(j.fecha,f)) out.push({c:'jun',t:j.hora}); });
    return out.slice(0,2);
  };

  let celdas = '';
  for(let i=0;i<offset;i++) celdas += `<div class="cell void"></div>`;
  for(let k=1;k<=total;k++){
    const f = new Date(Y,M,k);
    const ev = eventos(f).map(e=>`<span class="pill ${e.c}">${esc(e.t)}</span>`).join('');
    celdas += `<div class="cell ${sameDay(f,n)?'today':''}"><span class="d">${k}</span>${ev}</div>`;
  }

  const juntas = d.juntas.slice().sort((x,y)=>x.fecha-y.fecha).map(j => `
    <div class="person">
      <div class="i"><div class="nm">${esc(j.titulo)}</div><div class="rl">${esc(j.area)}</div></div>
      <div class="w">${fechaCorta(j.fecha)}<small>${j.hora}</small></div>
    </div>`).join('') || `<p style="font-size:0.72rem;color:var(--text-3)">Sin juntas programadas.</p>`;

  const vacs = d.vacaciones.map(v => `
    <div class="person">${avatar(v.nombre)}
      <div class="i"><div class="nm">${esc(nombre2(v.nombre))}</div><div class="rl">${esc(v.area)}</div></div>
      <div class="w">${fechaCorta(v.ini)}<small>al ${fechaCorta(v.fin)}</small></div>
    </div>`).join('') || `<p style="font-size:0.72rem;color:var(--text-3)">Sin ausencias este mes.</p>`;

  return cab(MESES_C[M] + ' ' + Y,
    'Cumpleaños, vacaciones, juntas y capacitaciones del mes en una sola vista.')
  + `<div class="two">
      <div class="panel">
        <div class="p-title">Calendario
          <span style="display:flex;gap:0.7rem">
            <span><i style="display:inline-block;width:0.4rem;height:0.4rem;border-radius:50%;background:#8FB8F0;margin-right:0.25rem"></i>Cumpleaños</span>
            <span><i style="display:inline-block;width:0.4rem;height:0.4rem;border-radius:50%;background:#7BD9A9;margin-right:0.25rem"></i>Vacaciones</span>
            <span><i style="display:inline-block;width:0.4rem;height:0.4rem;border-radius:50%;background:#C3A9E8;margin-right:0.25rem"></i>Juntas</span>
            <span><i style="display:inline-block;width:0.4rem;height:0.4rem;border-radius:50%;background:#F0C878;margin-right:0.25rem"></i>Capacitación</span>
          </span>
        </div>
        <div class="cal">
          <div class="dows">${DOW.map(x=>`<span>${x}</span>`).join('')}</div>
          <div class="days">${celdas}</div>
        </div>
      </div>
      <div class="stack">
        <div class="panel" style="flex:1">
          <div class="p-title">Juntas y reuniones</div>
          <div class="people">${juntas}</div>
        </div>
        <div class="panel" style="flex:1">
          <div class="p-title">De vacaciones</div>
          <div class="people">${vacs}</div>
        </div>
      </div>
    </div>`;
}

/* ---- 5. Reconocimiento ---- */
function vista5(d){
  const a = d.anuncios[0];
  if (a.imagen){
    return cab('Reconocimiento del mes','Aviso publicado por la Dirección de Innovación.')
      + `<div style="flex:1;display:grid;place-items:center;min-height:0">
          <img src="${esc(a.imagen)}" alt="${esc(a.titulo)}" style="max-width:100%;max-height:100%;border-radius:0.72rem">
         </div>`;
  }
  return cab('Reconocimiento del mes','Resultado del proyecto y mensaje de la Dirección de Innovación.')
  + `<div class="reco">
      <div class="reco-main">
        <div class="kick">${esc(a.hito)} · ${esc(a.satisfaccion)}</div>
        <h3>Equipo ${esc(a.proyecto)}</h3>
        <p class="lead">${esc(a.lead)}</p>
        <div class="ba">
          <div class="box"><div class="l">${a.antes.lbl}</div><div class="v">${a.antes.val}</div><div class="u">${a.antes.unit}</div></div>
          <div class="arw">→</div>
          <div class="box now"><div class="l">${a.ahora.lbl}</div><div class="v">${a.ahora.val}</div><div class="u">${a.ahora.unit}</div></div>
          <div class="delta">${a.deltaPct}<small>${a.deltaTxt}</small></div>
        </div>
      </div>
      <div class="reco-side">
        <div class="panel" style="flex:1">
          <div class="p-title">Mensaje de Dirección</div>
          <p style="font-size:0.78rem;color:var(--text-2);line-height:1.6">${esc(a.mensaje)}</p>
          <p style="font-size:0.95rem;color:var(--mauve);margin-top:0.8rem;font-family:'Space Grotesk',sans-serif">${esc(a.cierre)}</p>
        </div>
        <div class="panel">
          <div class="p-title">Lo que hizo posible el resultado</div>
          <div class="vals">${a.valores.map(v=>`<span>${esc(v)}</span>`).join('')}</div>
        </div>
      </div>
    </div>`;
}

/* ---- 6. Filosofía ---- */
function vista6(d){
  const f = d.filosofia;
  const ico = {
    globo:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15 0 18M12 3c-2.5 2.7-2.5 15 0 18"/>',
    flecha:'<path d="M3 17l6-6 4 4 8-8"/><path d="M21 7v5h-5"/>',
    escudo:'<path d="M12 3l8 3.5v5c0 5-3.4 8.6-8 9.5-4.6-.9-8-4.5-8-9.5v-5L12 3z"/>'
  };
  const c = (tono,soft,i,eb,ic,tit,cuerpo) => `
    <div class="phil" style="--tone:${tono};--tone-soft:${soft};border-color:${tono}44">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic}</svg></div>
      <div class="eb">0${i} / ${eb}</div>
      <h3>${tit}</h3>
      ${cuerpo}
      <span class="pb"></span>
    </div>`;

  return cab('Cómo trabajamos','Misión, visión y valores de Tekuno.')
  + `<div class="phil-grid">
      ${c('#7BA7F0','rgba(123,167,240,0.12)',1,'PROPÓSITO',ico.globo,'Nuestra misión',`<p>${esc(f.mision)}</p>`)}
      ${c('#C3A9E8','rgba(195,169,232,0.12)',2,'DESTINO',ico.flecha,'Nuestra visión',`<p>${esc(f.vision)}</p>`)}
      ${c('#F0C878','rgba(240,200,120,0.12)',3,'INTEGRIDAD',ico.escudo,'Nuestros valores',`<ul>${f.valores.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`)}
    </div>`;
}

/* ==========================================================================
   8. MOTOR DE ROTACIÓN
   ========================================================================== */
const SLIDES = [
  { id:'s1', nombre:'Panorama de la operación', dur:CONFIG.duraciones.s1, render:vista1 },
  { id:'s2', nombre:'Mesa de servicio',         dur:CONFIG.duraciones.s2, render:vista2 },
  { id:'s3', nombre:'Capacidad del equipo',     dur:CONFIG.duraciones.s3, render:vista3 },
  { id:'s4', nombre:'Calendario del mes',       dur:CONFIG.duraciones.s4, render:vista4 },
  { id:'s5', nombre:'Reconocimiento',           dur:CONFIG.duraciones.s5, render:vista5 },
  { id:'s6', nombre:'Cómo trabajamos',          dur:CONFIG.duraciones.s6, render:vista6 }
];

let actual = 0, transcurrido = 0, ultimo = null, pausado = false, cicloFil = null;
const sucias = new Set();

function construirRiel(){
  $('#rail').innerHTML = SLIDES.map((s,i)=>`
    <div class="rail-item" data-i="${i}">
      <span class="bar"><i></i></span>
      <span class="ix">${String(i+1).padStart(2,'0')}</span>
      <span class="nm">${s.nombre}</span>
    </div>`).join('')
    + `<div class="rail-foot">
        <span class="badge">Datos de ejemplo</span>
        <p>Calendario, cumpleaños, vacaciones y capacitaciones son ficticios hasta conectar la API.</p>
      </div>`;
}

function dibujar(i, forzar){
  const s = SLIDES[i], nodo = document.getElementById(s.id);
  if (!DATOS) return;
  if (!forzar && nodo.innerHTML && !sucias.has(i)) return;
  nodo.innerHTML = s.render(DATOS);
  sucias.delete(i);
}

function mostrar(i){
  actual = ((i % SLIDES.length) + SLIDES.length) % SLIDES.length;
  dibujar(actual, sucias.has(actual));
  SLIDES.forEach((s,k)=>document.getElementById(s.id).classList.toggle('on', k===actual));
  document.querySelectorAll('.rail-item').forEach((el,k)=>{
    el.classList.toggle('on', k===actual);
    el.classList.toggle('done', k<actual);
    const b = el.querySelector('.bar i');
    if (k<actual) b.style.height='100%'; else if (k>actual) b.style.height='0%';
  });
  transcurrido = 0;
  arrancarFilosofia();
}

function arrancarFilosofia(){
  clearInterval(cicloFil);
  const cards = document.querySelectorAll('#s6 .phil');
  if (!cards.length || SLIDES[actual].id !== 's6') return;
  let k = 0;
  const paso = () => { cards.forEach((c,i)=>c.classList.toggle('hot', i===k)); k = (k+1)%cards.length; };
  paso();
  cicloFil = setInterval(paso, 4000);
}

function siguiente(p=1){ mostrar(actual+p); }

function bucle(ts){
  if (ultimo===null) ultimo = ts;
  const dt = ts-ultimo; ultimo = ts;
  if (!pausado && DATOS){
    transcurrido += dt;
    const total = SLIDES[actual].dur*1000;
    const b = document.querySelector('.rail-item.on .bar i');
    if (b) b.style.height = Math.min(100, transcurrido/total*100) + '%';
    if (transcurrido >= total) siguiente(1);
  }
  requestAnimationFrame(bucle);
}

/* ==========================================================================
   9. ARRANQUE
   ========================================================================== */
function ajustarEscala(){
  const c = document.getElementById('canvas');
  const s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  c.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
window.addEventListener('resize', ajustarEscala);

function reloj(){
  const n = hoy();
  $('#clock').textContent = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  $('#fecha').textContent = n.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  pintarEstado();
}

async function actualizar(){
  await obtenerDatos();
  SLIDES.forEach((_,i)=>{ if(i!==actual) dibujar(i,true); else sucias.add(i); });
  $('#feedMsg').textContent = DATOS.recordatorio.texto;
  pintarEstado();
}

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight') siguiente(1);
  else if (e.key==='ArrowLeft') siguiente(-1);
  else if (e.code==='Space'){ e.preventDefault(); pausado=!pausado; document.body.classList.toggle('paused',pausado); }
  else if (e.key.toLowerCase()==='r') actualizar();
  else if (e.key.toLowerCase()==='f'){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
document.addEventListener('click', e => {
  const it = e.target.closest('.rail-item');
  if (it) mostrar(Number(it.dataset.i));
});

(async function iniciar(){
  construirRiel();
  ajustarEscala();
  await obtenerDatos();
  SLIDES.forEach((_,i)=>dibujar(i,true));
  $('#feedMsg').textContent = DATOS.recordatorio.texto;
  mostrar(0);
  reloj();
  setInterval(reloj, 1000);
  setInterval(actualizar, CONFIG.refrescoDatos*1000);
  setTimeout(()=>location.reload(), CONFIG.recargaTotal*1000);
  requestAnimationFrame(bucle);
})();
</script>
